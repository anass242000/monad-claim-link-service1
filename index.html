<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Claim Link</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Claim Link Service</h1>

        <div id="walletInfo" class="hidden">
            <p>Wallet Address: <span id="walletAddress"></span></p>
        </div>

        <button id="connectWalletBtn">Connect Wallet</button>

        <div id="claimLinkSection" class="hidden">
            <h3>Create Claim Link</h3>

            <label for="tokenSelect">Choose Token:</label>
            <select id="tokenSelect">
                <option value="0">MONAD</option>
                <option value="0xE0590015A873bF326bd645c3E1266d4db41C4E6B">CHOG</option>
                <option value="0x8aE599D8dbE745A809BCDb2be1a328881B410ebf">DAK</option>
                <option value="0x7E1f2824416F5B705b5c8b2F6b41bc28e5608996">YAKI</option>
            </select>

            <label for="amount">Amount:</label>
            <input type="number" id="amount" placeholder="Enter amount" required>

            <label for="expireTime">Expire Time (hours):</label>
            <input type="number" id="expireTime" placeholder="Enter expire time in hours" required>

            <button id="createClaimLinkBtn">Create Claim Link</button>
        </div>

        <div id="claimLinkInfo" class="hidden">
            <h3>Claim Link Details:</h3>
            <p>Claim Link: <a id="claimLink" target="_blank"></a></p>
            <p>Token: <span id="claimToken"></span></p>
            <p>Amount: <span id="claimAmount"></span></p>
            <p>Expires: <span id="claimExpireTime"></span></p>
        </div>

        <div id="claimSection" class="hidden">
            <h3>Claim Token</h3>
            <label for="claimLinkInput">Enter Claim ID:</label>
            <input type="text" id="claimLink" placeholder="Enter claim ID" required>
            <button id="claimBtn">Claim Token</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.6.9/dist/ethers.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
