<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Link Service</title>
    <style>
        /* Add your custom styles here */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f9f9f9;
        }

        h1 {
            margin-top: 20px;
            color: #333;
        }

        .container {
            width: 300px;
            margin-top: 20px;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .hidden {
            display: none;
        }

        .claim-link-info {
            margin-top: 20px;
            text-align: center;
        }

        .claim-link-info a {
            color: #4CAF50;
            text-decoration: none;
        }

        .claim-link-info p {
            color: #333;
        }
    </style>
</head>

<body>

    <h1>Claim Link Service</h1>

    <div class="container">
        <div id="walletInfo" class="hidden">
            <p id="walletAddress"></p>
            <div id="tokenSelectContainer" class="hidden">
                <select id="tokenSelect">
                    <option value="0">MONAD (native)</option>
                    <option value="0xE0590015A873bF326bd645c3E1266d4db41C4E6B">CHOG</option>
                    <!-- Add more token options here -->
                </select>
            </div>
            <div id="amountContainer" class="hidden">
                <input type="number" id="amount" placeholder="Amount" />
            </div>
            <div id="expireTimeContainer" class="hidden">
                <input type="number" id="expireTime" placeholder="Expiration Time (hours)" />
            </div>
            <button id="createClaimLinkBtn" class="hidden">Create Claim Link</button>
        </div>

        <button id="connectWalletBtn">Connect Wallet</button>
    </div>

    <!-- Claim Link Section -->
    <div id="claimLinkInfo" class="claim-link-info hidden">
        <p>Claim Link: <a id="claimLink" href="#" target="_blank">Click here</a></p>
        <p>Token: <span id="claimToken"></span></p>
        <p>Amount: <span id="claimAmount"></span></p>
        <p>Expires: <span id="claimExpireTime"></span></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.6.9/dist/ethers.umd.min.js"></script>


    <script src="https://cdn.ethers.io/lib/ethers-5.2.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
